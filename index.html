<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./src/images/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="./src/css/reset.css" />

  <body id="body">
  <div class="cam-selection">
      <button class="btn-cam active" data-p="90.7rem" data-o="50% 20%" data-f="48%">Cam 1</button>
      <button class="btn-cam" data-p="100.7rem" data-o="50% 50%" data-f="38%">Cam 2</button>
      <button class="btn-cam" data-p="100.7rem" data-o="50% 0%" data-f="38%">Cam 3</button>
      <button class="btn-cam" data-p="100.7rem" data-o="50% 50%" data-f="60%">Cam 4</button>
      <button class="btn-cam" data-p="100.7rem" data-o="50% 90%" data-f="60%">Cam 5</button>
  </div>
    <section class="scene">
      <div class="cube">

        <div></div>

        <div></div>
        <div></div>

        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
      <img class="img_left" src="./src/images/sparkes.gif"  alt="">
      <img class="img_right" src="./src/images/sparkes.gif" alt="">
      <div class="behind_img"></div>

      <div class="floor">
        <div></div>
        <p>✨</p>
        <p>✨<span class="creator">D.<br>Castro</span></p>
        <p>✨</p>
        <p>✨</p>
        <div class="shadow"></div>
      </div>
    </section>

    <script src="src/script.js"></script>

</html>
